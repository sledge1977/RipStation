[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ripstation"
dynamic = ["version"]
description = "Multi-drive MakeMKV ripping station for movies and TV series"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jens Kleen" }]

[project.scripts]
ripstation = "ripstation.app:main"

[tool.setuptools]
packages = ["ripstation"]

[tool.setuptools.dynamic]
version = { attr = "ripstation.__version__" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are left to the formatter

[tool.mypy]
python_version = "3.10"
files = ["ripstation"]
check_untyped_defs = true
warn_unused_ignores = true
